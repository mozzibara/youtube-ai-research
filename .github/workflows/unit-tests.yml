name: Public offline regression CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-offline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public tracked-file allowlist and literals
        run: python -m tools.check_public_snapshot

  offline-tests:
    needs: public-source-audit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source and tests
        run: python -m compileall -q ytresearch tests tools
      - name: Run full isolated unit suite
        run: python -m unittest discover -s tests -v
      - name: Phase 5E offline worker contracts
        run: python -m ytresearch phase5e-validate
      - name: Phase 5D offline 12x3 contention and budget stress
        run: python -m ytresearch phase5d-stress --workers 12 --rounds 3
      - name: Summarize safe test results
        shell: bash
        run: |
          echo "Public offline verification succeeded on ${{ matrix.os }}." >> "$GITHUB_STEP_SUMMARY"
          echo "Only synthetic data was used; no actual AGY or YouTube calls were enabled." >> "$GITHUB_STEP_SUMMARY"
