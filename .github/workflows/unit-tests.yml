name: Public offline regression CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-offline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify public tracked-file allowlist and literals
        run: python -m tools.check_public_snapshot

  offline-tests:
    needs: public-source-audit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ensure FFmpeg is available (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Ensure FFmpeg is available (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            $chocoBin = Join-Path $env:ProgramData "chocolatey\bin"
            if (Test-Path $chocoBin) {
              Add-Content -Path $env:GITHUB_PATH -Value $chocoBin
            }
          }
      - name: Verify FFmpeg executable and required encoders
        run: |
          python -c "import re, shutil, subprocess; ff = shutil.which('ffmpeg'); assert ff, 'FFMPEG_NOT_FOUND'; v = subprocess.run([ff, '-version'], capture_output=True, text=True, check=True); print(v.stdout.splitlines()[0]); enc = subprocess.run([ff, '-hide_banner', '-encoders'], capture_output=True, text=True, check=True).stdout; missing = [e for e in ('libx264', 'aac') if not re.search(rf'^\s*[VA][A-Za-z.]{{5}}\s+{e}\b', enc, re.M)]; assert not missing, f'MISSING_ENCODERS: {missing}'; print(f'FFMPEG_VERIFIED path={ff} encoders=libx264,aac')"
      - name: Compile source and tests
        run: python -m compileall -q ytresearch tests tools
      - name: Run full isolated unit suite
        run: python -m unittest discover -s tests -v
      - name: Phase 5E offline worker contracts
        run: python -m ytresearch phase5e-validate
      - name: Phase 5F offline recovery, receipts and no-clobber preflight
        run: python -m ytresearch phase5f-validate
      - name: Phase 5D offline 12x3 contention and budget stress
        run: python -m ytresearch phase5d-stress --workers 12 --rounds 3
      - name: Summarize safe test results
        shell: bash
        run: |
          echo "Public offline verification succeeded on ${{ matrix.os }}." >> "$GITHUB_STEP_SUMMARY"
          echo "Only synthetic data was used; no actual AGY or YouTube calls were enabled." >> "$GITHUB_STEP_SUMMARY"
