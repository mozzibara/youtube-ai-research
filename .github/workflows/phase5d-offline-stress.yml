name: Phase 5D Synthetic Stress (manual)

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Synthetic concurrent workers"
        type: choice
        required: true
        default: "12"
        options: ["8", "12", "16", "24", "32"]
      rounds:
        description: "Isolated synthetic rounds"
        type: choice
        required: true
        default: "3"
        options: ["1", "3", "5", "10"]

permissions:
  contents: read

jobs:
  offline-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify public contents
        run: python -m tools.check_public_snapshot
      - name: Run manually approved offline fixture stress
        env:
          STRESS_WORKERS: ${{ inputs.workers }}
          STRESS_ROUNDS: ${{ inputs.rounds }}
        shell: bash
        run: |
          python -m ytresearch phase5d-stress --workers "$STRESS_WORKERS" --rounds "$STRESS_ROUNDS"
